<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Loaded here (not via CSS @import) so it fetches in parallel with the
         page instead of blocking on the stylesheet parse — a slow/blocked
         @import is what made different sections briefly render in different
         fallback fonts before Inter kicked in. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Twedot — Social Network, Local Vendors & Content Monetisation</title>
    <meta name="description" content="Twedot is a social network built around local commerce and content. Post to a public feed, chat privately, discover vendors nearby, and earn money from your videos." />
    <meta name="keywords" content="Twedot, social network, local vendors, public feed, content monetisation, private messaging, vendor discovery, local commerce, nearby services, earn from videos" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Twedot" />

    <!-- Open Graph -->
    <meta property="og:title" content="Twedot — Social Network, Local Vendors & Content Monetisation" />
    <meta property="og:description" content="Post to a public feed, discover local vendors, chat privately, and earn from your content. Twedot is social media with local commerce built in." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/founders.jpeg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Twedot — Social Network, Local Vendors & Content Monetisation" />
    <meta name="twitter:description" content="Post to a public feed, discover local vendors, chat privately, and earn from your content. Twedot is social media with local commerce built in." />
    <meta name="twitter:image" content="/founders.jpeg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
