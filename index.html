<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Loaded here (not via CSS @import) so it fetches in parallel with the
         page instead of blocking on the stylesheet parse — a slow/blocked
         @import is what made different sections briefly render in different
         fallback fonts before Inter kicked in. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Twedot — Private Chats & Local Vendor Discovery Near You</title>
    <meta name="description" content="Twedot is a private messaging app with built-in local vendor discovery. Chat securely and find trusted service providers in your neighbourhood, anywhere in the world." />
    <meta name="keywords" content="Twedot, local vendors, private messaging, vendor discovery, local commerce, encrypted chat, nearby services" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Twedot" />

    <!-- Open Graph -->
    <meta property="og:title" content="Twedot — Private Chats & Local Vendor Discovery Near You" />
    <meta property="og:description" content="Chat privately and discover trusted local vendors near you. Twedot combines secure messaging with local commerce." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/founders.jpeg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Twedot — Private Chats & Local Vendor Discovery Near You" />
    <meta name="twitter:description" content="Chat privately and discover trusted local vendors near you. Twedot combines secure messaging with local commerce." />
    <meta name="twitter:image" content="/founders.jpeg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
